name: Finalize real screenshot copy

on:
  push:
    branches:
      - feat/product-proof-commercial-flow-2026-09

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          ref: feat/product-proof-commercial-flow-2026-09

      - name: Correct public screenshot labels
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/i18n/landing_refresh_locales.ts')
          text = path.read_text()
          replacements = {
              'data_label: "DADOS DEMONSTRATIVOS",': 'data_label: "DADOS SANITIZADOS",',
              '"Visualização demonstrativa do fluxo implementado, construída com dados fictícios. Não reproduz dados de cliente nem parâmetros reais de scoring.",': '"Capturas da plataforma real. Identificadores e informações de cliente foram ocultados ou sanitizados para exposição pública; não exibimos parâmetros reais de scoring.",',
              'data_label: "DEMO DATA",': 'data_label: "SANITIZED DATA",',
              '"Demonstrative view of the implemented workflow, built with fictional data. It contains no client data or real scoring parameters.",': '"Screenshots from the real platform. Client identifiers and information were hidden or sanitized for public display; real scoring parameters are not shown.",',
              'data_label: "DATOS DEMOSTRATIVOS",': 'data_label: "DATOS SANITIZADOS",',
              '"Vista demostrativa del flujo implementado, construida con datos ficticios. No contiene datos de clientes ni parámetros reales de scoring.",': '"Capturas de la plataforma real. Los identificadores y la información del cliente fueron ocultados o sanitizados para exposición pública; no mostramos parámetros reales de scoring.",',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Missing expected text: {old}')
              text = text.replace(old, new)
          path.write_text(text)
          PY

      - name: Remove one-off transfer workflows
        run: |
          rm -f .github/workflows/import-product-screenshots.yml
          rm -f .github/workflows/finalize-real-screenshots.yml

      - name: Commit finalization
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'fix: label public product captures as sanitized'
          git push origin HEAD:feat/product-proof-commercial-flow-2026-09
